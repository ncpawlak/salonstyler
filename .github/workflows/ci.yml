name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run check:edge-imports

  edge-functions:
    name: Edge Functions (deno check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: deno check every function entrypoint
        run: |
          status=0
          for dir in supabase/functions/*/; do
            [ -f "$dir/index.ts" ] || continue
            echo "::group::$dir"
            (cd "$dir" && deno check --quiet index.ts) || { echo "::error file=${dir}index.ts::deno check failed"; status=1; }
            echo "::endgroup::"
          done
          exit $status

  database:
    name: Database tests and generated types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: 3.1.0
      - name: Start Supabase
        run: supabase start -x studio,edge-runtime,logflare,vector,imgproxy,supavisor,realtime
      - name: pgTAP tests
        run: supabase test db
      - name: Regenerate database types
        run: npm run gen:types --workspace @chairside/db
      - name: Check database.types.ts is up to date
        run: |
          if ! git diff --exit-code -- packages/db/src/database.types.ts; then
            echo "::error file=packages/db/src/database.types.ts::Generated types are stale. Run 'npx supabase start' then 'npm run gen:types --workspace @chairside/db' and commit the result. On a merge conflict, take either side and regenerate."
            exit 1
          fi
